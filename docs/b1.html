<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-1 링커와 원소 바꾸기</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.2/3Dmol-min.js"></script>
<script src="site.js"></script>
</head>
<body>
<div id="nav"></div>
<h1>B-1. 링커와 원소 바꾸기</h1>
<p>A-3에서 고른 3개마다 링커 작용기 7종과 금속 6종을 바꾼 구조를 만들었습니다.</p>
<p>
  원본 MOF <select id="parent"></select>
  수정 <select id="mod"></select>
</p>
<div class="cols">
  <div><p class="small">원본</p><div id="v1" class="viewer"></div></div>
  <div><p class="small" id="modLabel">수정</p><div id="v2" class="viewer"></div></div>
</div>
<h2>원소 교체 에너지 (Zr 기준)</h2>
<p class="small">0보다 작을수록 Zr보다 그 금속이 유리합니다. 막대 색은 산화수: 파랑 +4, 주황 +3, 초록 +2, 빨강 +1. CHGNet으로 계산했습니다.</p>
<div id="swap"></div>
<div id="swapTable"></div>
<p><a href="b2.html">다음: B-2 같은 AI로 다시 채점 →</a></p>
<script>
Promise.all([loadJSON('data/stage_b.json'), loadJSON('data/metal_swap.json')]).then(([b, swap]) => {
  const parents = [...new Set(b.map(r => r.parent))];
  const pSel = document.getElementById('parent'), mSel = document.getElementById('mod');
  pSel.innerHTML = parents.map(p => `<option>${esc(p)}</option>`).join('');
  function fillMods() {
    const mods = b.filter(r => r.parent === pSel.value && r.change !== '원본');
    mSel.innerHTML = mods.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('');
    showPair();
  }
  function showPair() {
    const m = b.find(r => r.id === mSel.value);
    document.getElementById('modLabel').textContent = `수정: ${m.detail}`;
    crystal('v1', `data/structures/${m.parent_id}.cif`);
    crystal('v2', `data/structures/${m.id}.cif`, { highlight: m.change === '원소' ? [m.metal] : ['Zr'] });
  }
  pSel.addEventListener('change', fillMods); mSel.addEventListener('change', showPair); fillMods();

  const s = [...swap].sort((x, y) => x.dE - y.dE);
  const col = { 4: '#1f77b4', 3: '#ff7f0e', 2: '#2ca02c', 1: '#d62728' };
  Plotly.newPlot('swap', [{ type: 'bar', x: s.map(r => r.metal), y: s.map(r => r.dE), marker: { color: s.map(r => col[r.ox]) },
    text: s.map(r => (r.dE > 0 ? '+' : '') + r.dE.toFixed(2)), textposition: 'outside' }],
    { height: 340, margin: { l: 50, r: 10, t: 20, b: 40 }, yaxis: { title: 'eV / 금속', zeroline: true }, font: { family: 'sans-serif' } },
    { displayModeBar: false, responsive: true });
  table(document.getElementById('swapTable'), s, [['metal', '금속'], ['ox', '산화수', v => `+${v}`], ['dE', 'ΔE (eV)', v => (v > 0 ? '+' : '') + v.toFixed(2)],
    ['balanced', '전하 맞음', v => v ? '예' : '아니오 (가상 구조)'], ['reported', '실제 보고']]);
});
</script>
</body>
</html>
