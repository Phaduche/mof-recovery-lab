<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.2/3Dmol-min.js"></script>
<script src="site.js"></script>
</head>
<body>
<div id="nav"></div>
<h1 id="title">Final</h1>
<p class="small">A-1 &gt; A-2 &gt; A-3 &gt; B-1 &gt; B-2 &gt; Final</p>
<div id="summary"></div>
<div class="cols">
  <div><div id="viewer" class="viewer" style="height:440px"></div><p class="small">드래그: 회전 / 스크롤: 확대 · <a id="cif" download>CIF 파일 내려받기</a></p></div>
  <div><h2>수정본 상위 5개</h2><div id="bars"></div></div>
</div>
<div id="footer"></div>
<script>
Promise.all([loadJSON('data/stage_a.json'), loadJSON('data/stage_b.json')]).then(([a, b]) => {
  const win = b[0];
  const parent = a.find(r => r.name === win.parent);
  document.getElementById('title').textContent = `Final. ${win.name}`;
  document.title = `Final · ${win.name}`;
  table(document.getElementById('summary'), [
    { k: '최종 점수 / 200', v: `${fmt1(win.total)} (원본 ${win.parent} ${fmt1(parent.total)}점 대비 ${win.total - parent.total >= 0 ? '+' : ''}${fmt1(win.total - parent.total)})` },
    { k: '안정성 / 100', v: fmt1(win.stability) },
    { k: '포집 / 40 · 탈착 / 35 · 재사용 / 25', v: `${fmt1(win.capture)} · ${fmt1(win.desorption)} · ${fmt1(win.reuse)}` },
    { k: '수정 내용', v: `${win.change}: ${win.detail}` }], [['k', '항목'], ['v', '값']]);
  crystal('viewer', `data/structures/${win.id}.cif`, { style: 'ballstick', spin: true, highlight: ['Zr', 'O'] });
  const cif = document.getElementById('cif'); cif.href = `data/structures/${win.id}.cif`; cif.download = `${win.id}.cif`;
  scoreBars('bars', b.slice(0, 5), 300);
});
</script>
</body>
</html>
